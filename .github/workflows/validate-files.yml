name: Validate Files & Corpus

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-forbidden-files:
    name: Check Forbidden File Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need history for diff on PRs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for forbidden files in diff
        run: |
          set -euo pipefail

          # On PRs, check only changed files; on push, check all tracked files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM \
              origin/${{ github.base_ref }}..HEAD)
          else
            FILES=$(git ls-files)
          fi

          echo "$FILES" | python scripts/check_forbidden_files.py

      - name: Verify ingestion directory is empty in repo
        run: |
          set -euo pipefail

          # ingestion/ and ingestion_out/ should never contain real files in the repo
          FORBIDDEN_DIRS="ingestion ingestion_out"
          VIOLATIONS=""

          for dir in $FORBIDDEN_DIRS; do
            if [ -d "$dir" ]; then
              # Allow README.md and .gitkeep, nothing else
              REAL_FILES=$(find "$dir" -type f \
                ! -name "README.md" \
                ! -name ".gitkeep" \
                ! -name ".gitignore" 2>/dev/null || true)
              if [ -n "$REAL_FILES" ]; then
                VIOLATIONS="$VIOLATIONS\n$REAL_FILES"
              fi
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "🚫 Forbidden files found in ingestion directories:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "These directories should only contain README.md / .gitkeep."
            echo "Raw documents and ingestion artifacts must not be committed."
            exit 1
          fi

          echo "✅ Ingestion directories are clean."

  validate-corpus:
    name: Validate Corpus Integrity
    runs-on: ubuntu-latest
    needs: check-forbidden-files
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lfl
        run: pip install -e ".[dev]"

      - name: Validate all corpora
        run: |
          set -euo pipefail
          EXIT_CODE=0

          for corpus_dir in corpora/*/; do
            domain=$(basename "$corpus_dir")
            echo "🔍 Validating corpus: $domain"

            if ! lfl validate "$corpus_dir"; then
              echo "  ✗ $domain has validation errors"
              EXIT_CODE=1
            else
              echo "  ✓ $domain passed"
            fi
          done

          exit $EXIT_CODE
